<style>
/* Layout: one infinite drawing sheet at true metric scale (1 unit = 1 m). Board A plates, board B figure poster, board C landmarks, all one scale; UI floats over it. */
:root{
  --paper:#fbfbf9; --ink:#141413; --figure:#111; --quiet:#6e6e68; --hair:#cfcfc9; --panel:rgba(251,251,249,.94); --mark:#c23b22;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;

  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-display);overflow:hidden}
#app{position:fixed;inset:0}
#stage{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--paper)}
#stage.drag{cursor:grabbing}
.frame{fill:#fff;stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke}
.tick{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.rule{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.hair{stroke:var(--hair);stroke-width:1;vector-effect:non-scaling-stroke}
.fig{fill:var(--figure);fill-rule:evenodd}
.t-sec{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.t-name{font-family:var(--f-display);font-weight:600;fill:var(--ink);text-transform:uppercase;letter-spacing:.02em}
.t-body{font-family:var(--f-display);fill:#3a3a37}
.t-mono{font-family:var(--f-mono);fill:var(--quiet)}
.t-zh{font-family:var(--f-zh);fill:var(--quiet)}
.hit{fill:transparent;cursor:zoom-in}
.ui{position:absolute;background:var(--panel);border:1px solid var(--ink);font-family:var(--f-mono);font-size:11.5px;color:var(--ink)}
#title{left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));padding:10px 14px;max-width:min(380px,calc(100vw - 28px))}
#title h1{margin:2px 0 4px;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.01em}
#title .k{color:var(--quiet);letter-spacing:.1em;text-transform:uppercase;font-size:10.5px}
#title p{margin:0;color:var(--quiet);line-height:1.45}
#ctrl{right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column}
#ctrl button,#nav button{font:inherit;background:transparent;color:var(--ink);border:0;padding:8px 12px;cursor:pointer;text-align:left}
#ctrl button+button{border-top:1px solid var(--ink)}
#ctrl button:hover,#nav button:hover{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
#nav{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap}
#nav button+button{border-left:1px solid var(--ink)}
#scale{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px 12px;display:flex;align-items:center;gap:10px}
#sbar{height:7px;border:1px solid var(--ink);border-top:0;background:linear-gradient(90deg,var(--ink) 0 50%,transparent 50%)}
#zoomv{color:var(--quiet)}
@media (max-width:640px){#title p{display:none}#nav{bottom:calc(58px + env(safe-area-inset-bottom,0px))}}
</style>

TX(AX,AY-250,'A',150,'t-sec');TX(AX+150,AY-250,'Fabric fields',72,'t-sec');
TX(AX+152,AY-170,'Twelve 800 × 800 m pieces of the existing city · main function · nature · operator',34,'t-mono');
D.fabric.forEach((f,i)=>{const c=i%6,r=Math.floor(i/6),x=AX+c*(P+GX),y=AY+r*(P+GY),t=T[f.key];
  E('rect',{x,y,width:P,height:P,class:'frame'});
  const g=E('g',{transform:`translate(${x} ${y})`});E('path',{d:f.d,class:'fig'},g);
  E('rect',{x:x,y:y,width:P,height:P,class:'hit','data-zoom':`${x},${y},${P},${P+300}`});
  const cy=y+P+52;TX(x,cy,`${String(i+1).padStart(2,'0')}  ${t[0]}`,38,'t-name');TX(x+P,cy,t[1],32,'t-zh','end');
  TX(x,cy+48,`${t[2]}`,27,'t-body');TX(x,cy+88,`${t[3]}`,27,'t-body');
  TX(x,cy+136,`cover ${pct(f.cov)} · ${nf(f.n)} figures · median ${nf(f.medA)} m² · ${useName[Object.keys(f.cls)[0]]||''}`,23,'t-mono');
  TX(x,cy+176,t[4],25,'t-mono').setAttribute('style','fill:var(--ink)');
});
const AW=6*P+5*GX,AH=2*P+GY+P-90;
scaleBar(AX+AW-1000,AY+AH+60,[200,200,400],30);
boards.A=[AX-60,AY-420,AW+120,AH+600];
// ---------- B: figure grid ----------
const BY=AY+AH+520,COLS=22,PX=AW/COLS,BOX=190,PY=310;
TX(AX,BY,'B',150,'t-sec');TX(AX+150,BY,'Single figures',72,'t-sec');
TX(AX+152,BY+80,`${D.objs.length} distinct footprints from the 19 most frequent families · near-identical shapes removed · one scale, north up`,34,'t-mono');
const by0=BY+200;
D.objs.forEach((o,i)=>{const c=i%COLS,r=Math.floor(i/COLS),cx=AX+c*PX+PX/2,cy=by0+r*PY+BOX/2;
  E('path',{d:o.d,class:'fig',transform:`translate(${(cx-o.w/2).toFixed(1)} ${(cy-o.h/2).toFixed(1)})`});
  const ty=by0+r*PY+BOX+34;
  TX(cx,ty,o.t,17,'t-name','middle');TX(cx,ty+24,o.u,14,'t-body','middle');TX(cx,ty+46,`${o.L} × ${o.W} m`,12.5,'t-mono','middle');
  E('rect',{x:cx-PX/2,y:by0+r*PY-20,width:PX,height:PY,class:'hit','data-zoom':`${cx-PX*1.5},${by0+r*PY-40},${PX*3},${PY+20}`});
});
const BH=Math.ceil(D.objs.length/COLS)*PY+260;
scaleBar(AX+AW-500,BY+BH+20,[50,50,100],22);
boards.B=[AX-60,BY-200,AW+120,BH+330];
// ---------- C: landmark grid ----------
const CY=BY+BH+330,CC=4,CPX=AW/CC,CBOX=600,CPY=CBOX+300;
TX(AX,CY,'C',150,'t-sec');TX(AX+150,CY,'Landmarks',72,'t-sec');
TX(AX+152,CY+80,'The market and logistics figures that set Yiwu’s largest scale, at the same scale as every house above',34,'t-mono');
const cy0=CY+220;
D.lms.forEach((o,i)=>{const c=i%CC,r=Math.floor(i/CC),cx=AX+c*CPX+CPX/2,cyy=cy0+r*CPY+CBOX/2;
  E('path',{d:o.d,class:'fig',transform:`translate(${(cx-o.w/2).toFixed(1)} ${(cyy-o.h/2).toFixed(1)})`});
  const ty=cy0+r*CPY+CBOX+70;
  TX(cx,ty,o.t,36,'t-name','middle');TX(cx,ty+44,o.u,26,'t-zh','middle');TX(cx,ty+84,`${nf(o.L)} × ${nf(o.W)} m · ${nf(o.A)} m²`,24,'t-mono','middle');
  E('rect',{x:cx-CPX/2,y:cy0+r*CPY,width:CPX,height:CPY,class:'hit','data-zoom':`${cx-CPX/2},${cy0+r*CPY-40},${CPX},${CPY}`});
});
const CH=Math.ceil(D.lms.length/CC)*CPY+220;scaleBar(AX+AW-1000,CY+CH+40,[200,200,400],30);
boards.C=[AX-60,CY-200,AW+120,CH+360];
const ALL=[AX-200,AY-480,AW+400,CY+CH+200-(AY-480)];
// ---------- view ----------
let k=1,tx=0,ty=0;const MINK=()=>fitK(ALL)*.5,MAXK=40;
function fitK(b){const r=svg.getBoundingClientRect();return Math.min(r.width/b[2],r.height/b[3])}
function apply(){W.setAttribute('transform',`translate(${tx} ${ty}) scale(${k})`);
  const nice=[1,2,5,10,20,50,100,200,500,1000,2000];const target=120/k;let m=nice[0];for(const n of nice)if(n<=target)m=n;
  document.getElementById('sbar').style.width=(m*k).toFixed(0)+'px';document.getElementById('slabel').textContent=m>=1000?(m/1000)+' km':m+' m';
  document.getElementById('zoomv').textContent=`1 px = ${(1/k).toFixed(k>1?2:1)} m`;}
let anim=null;
function go(b,ms=450){const r=svg.getBoundingClientRect(),nk=Math.min(MAXK,fitK(b)*.94),ntx=r.width/2-(b[0]+b[2]/2)*nk,nty=r.height/2-(b[1]+b[3]/2)*nk;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce||!ms){k=nk;tx=ntx;ty=nty;apply();return}
  const k0=k,x0=tx,y0=ty,t0=performance.now();cancelAnimationFrame(anim);
  const step=t=>{let u=Math.min(1,(t-t0)/ms);u=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;const lk=Math.exp(Math.log(k0)+(Math.log(nk)-Math.log(k0))*u);
   // interpolate world centre
   const c0x=(r.width/2-x0)/k0,c0y=(r.height/2-y0)/k0,c1x=(r.width/2-ntx)/nk,c1y=(r.height/2-nty)/nk,cx=c0x+(c1x-c0x)*u,cy=c0y+(c1y-c0y)*u;
   k=lk;tx=r.width/2-cx*k;ty=r.height/2-cy*k;apply();if(u<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
function zoomAt(f,px,py){cancelAnimationFrame(anim);const nk=Math.max(MINK(),Math.min(MAXK,k*f));tx=px-(px-tx)*(nk/k);ty=py-(py-ty)*(nk/k);k=nk;apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const pts=new Map();let last=null,pinch=null,moved=0;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;svg.classList.add('drag');cancelAnimationFrame(anim);
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}}});
svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=svg.getBoundingClientRect();zoomAt(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch.d=d;tx+=dx/2;ty+=dy/2;apply()}
  else if(pts.size===1){tx+=dx;ty+=dy;apply()}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)svg.classList.remove('drag')};
svg.addEventListener('pointerup',e=>{up(e);if(moved<6){const h=e.target.closest&&e.target.closest('[data-zoom]');if(h)go(h.dataset.zoom.split(',').map(Number))}});
svg.addEventListener('pointercancel',up);
svg.addEventListener('dblclick',e=>{const r=svg.getBoundingClientRect();zoomAt(2.2,e.clientX-r.left,e.clientY-r.top)});
const ctr=f=>{const r=svg.getBoundingClientRect();zoomAt(f,r.width/2,r.height/2)};
document.getElementById('zin').onclick=()=>ctr(1.8);document.getElementById('zout').onclick=()=>ctr(1/1.8);document.getElementById('zfit').onclick=()=>go(ALL);
document.getElementById('gA').onclick=()=>go(boards.A);document.getElementById('gB').onclick=()=>go(boards.B);document.getElementById('gC').onclick=()=>go(boards.C);
addEventListener('keydown',e=>{if(e.target.closest('button'))return;if(e.key==='+'||e.key==='=')ctr(1.5);else if(e.key==='-')ctr(1/1.5);else if(e.key==='0')go(ALL);
  else if(e.key.startsWith('Arrow')){const s=80;if(e.key==='ArrowLeft')tx+=s;if(e.key==='ArrowRight')tx-=s;if(e.key==='ArrowUp')ty+=s;if(e.key==='ArrowDown')ty-=s;apply()}});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>go(ALL,0),120)});
go(ALL,0);
})();
</script>
